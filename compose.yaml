services:
  portfolio:
    # La imagen ya compilada se baja de Docker Hub: en el servidor basta «docker compose up -d».
    # Se genera y se sube desde tu ordenador (compose.local.yaml; ver DESPLIEGUE.md)
    image: alon54/aosuna-portfolio:latest
    # Cada «up» mira si hay una imagen más nueva en Docker Hub; si la hay, cambia el contenedor
    pull_policy: always
    container_name: portfolio
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Rotación de logs (SEC-03): como mucho tres archivos de 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sin puertos publicados: solo Caddy (deploy/caddy/) habla con este contenedor, por la red «web»
    networks:
      - web

networks:
  web:
    external: true
