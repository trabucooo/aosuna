services:
  portfolio:
    build:
      context: .
      args:
        # Se lee del archivo .env que hay junto a este compose.yaml (ver .env.example). Vacío: sin analítica
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    container_name: portfolio
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Rotación de logs (SEC-03): como mucho tres archivos de 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sin puertos publicados: solo Caddy (deploy/caddy/) habla con este contenedor, por la red «web»
    networks:
      - web

networks:
  web:
    external: true
