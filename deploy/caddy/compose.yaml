# Caddy: la única puerta de entrada del VPS. Atiende los puertos 80 y 443, saca y renueva solo los certificados
# HTTPS (Let's Encrypt) y reparte cada dominio a su contenedor por la red «web».
# Va en su propia carpeta del servidor (~/apps/caddy), separado del portfolio: así desplegar una web no reinicia
# la puerta de entrada de las demás. Ver DESPLIEGUE.md.
services:
  caddy:
    image: caddy:2.11.9-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Aquí guarda Caddy los certificados. Si se pierde este volumen, los pide otra vez (Let's Encrypt limita
      # cuántos da por semana): no lo borres
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # para poder abrir los puertos 80 y 443
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
