server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirecciones relativas (D-01): si nginx manda /en a /en/, el Location no lleva http://aosuna.es:8080,
    # que es el puerto interno detrás de Caddy y no está publicado
    absolute_redirect off;

    # Compresión. Hoy la hace Caddy, que va delante (zstd y gzip); esto es para que no dependa de él.
    # application/json: los puntos de las formas (nautes-puntos.json pesa 192 KB sin comprimir y unos 50 KB con gzip).
    # Los dos tipos de JavaScript: según la versión, nginx sirve los .js como uno o como otro
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    # Para las respuestas que no pasan por un location con add_header propio
    include /etc/nginx/snippets/security-headers.conf;

    # Cualquier ruta que no exista devuelve un 404 de verdad con la página propia
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        # "always" porque la respuesta sale con código 404
        add_header Cache-Control "no-cache" always;
    }

    # Los archivos de Vite llevan una huella en el nombre: se pueden cachear un año.
    # "^~": con este prefijo ya no se miran los location con expresión regular de más abajo
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El CV se revisa en cada descarga para que siempre salga la última versión
    location ^~ /cv/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Lo que sale de public/ sin huella en el nombre: los JSON de puntos, las capturas, los SVG de tinta, el icono
    # y las imágenes al compartir. Un día en caché; pasado ese día, el navegador enseña la copia que tiene y la
    # renueva por detrás (stale-while-revalidate), hasta una semana. Antes se revalidaban uno a uno en cada visita.
    # Si cambias uno de estos archivos, los visitantes que repiten lo verán como mucho un día después
    location ~* \.(?:json|webp|png|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Páginas (y boot.js, robots.txt y sitemap.xml): siempre se comprueba si hay versión nueva.
    # "$uri/" más "index index.html" hace que / sirva index.html, /en y /en/ sirvan en/index.html
    # y /zalapp/ y /en/zalapp/, las suyas; lo demás, 404
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
