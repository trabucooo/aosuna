server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirecciones relativas (D-01): si nginx manda /en a /en/, el Location no lleva http://aosuna.es:8080,
    # que es el puerto interno detrás de Caddy y no está publicado
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Para las respuestas que no pasan por un location con add_header propio
    include /etc/nginx/snippets/security-headers.conf;

    # Cualquier ruta que no exista devuelve un 404 de verdad con la página propia
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        # "always" porque la respuesta sale con código 404
        add_header Cache-Control "no-cache" always;
    }

    # Los archivos de Vite llevan una huella en el nombre: se pueden cachear un año
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El CV se revisa en cada descarga para que siempre salga la última versión
    location /cv/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Páginas. "$uri/" más "index index.html" hace que / sirva index.html
    # y que /en y /en/ sirvan en/index.html; lo demás, 404
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
