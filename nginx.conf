server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Los archivos de Vite llevan una huella en el nombre: se pueden cachear un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Versión en inglés: /en y /en/ sirven en/index.html
    location /en/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /en/index.html;
    }

    # El CV se revisa en cada descarga para que siempre salga la última versión
    location /cv/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
