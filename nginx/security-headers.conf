# Cabeceras de seguridad. Se incluyen en cada location que tenga add_header,
# porque en nginx un add_header dentro de un location anula los del server.
# HSTS no va aquí: lo pone Caddy, que es quien sirve HTTPS (ver CADDY.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.aosuna.es; connect-src 'self' https://stats.aosuna.es; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
